<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>سالن فوتسال</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/persian-datepicker@1.2.0/dist/css/persian-datepicker.min.css">
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/persian-date@1.1.0/dist/persian-date.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/persian-datepicker@1.2.0/dist/js/persian-datepicker.min.js"></script>
<style>
*{box-sizing:border-box}
:root{--navy:#07172d;--navy2:#102b4c;--navy3:#17395f;--orange:#d65b0b;--orange2:#ff790d;--paper:#07172d;--ink:#f4f7fb;--muted:#b7c6d8;--line:#28476a}
html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(ellipse at 50% 0%,#17395f 0%,#07172d 58%);color:var(--ink);font-family:Tahoma,Arial,sans-serif;line-height:1.7}
header{height:clamp(340px,31vw,430px);min-height:340px;background:#06152a url('futsal-hero.jpg') center 25%/cover no-repeat;border-bottom:4px solid var(--orange);position:relative;overflow:hidden}
header:after{content:"";position:absolute;inset:auto 0 0;height:45px;background:linear-gradient(transparent,rgba(3,13,28,.42));pointer-events:none}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
main{max-width:1120px;margin:auto;padding:22px 16px 55px;position:relative}
.card{background:linear-gradient(145deg,rgba(13,37,67,.98),rgba(5,20,39,.98));border:1px solid #294c73;border-radius:20px;padding:22px;margin:16px 0;box-shadow:0 12px 32px rgba(0,0,0,.24),inset 0 1px rgba(255,255,255,.035)}
h1{margin:0 0 8px}h2{font-size:20px;color:#fff;margin:0 0 16px;padding-right:12px;border-right:4px solid var(--orange2)}
.tabs,.actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
button{background:linear-gradient(135deg,#e96b0b,#c84d06);color:white;border:1px solid rgba(255,177,103,.3);border-radius:12px;padding:11px 18px;font:inherit;font-weight:700;cursor:pointer;transition:filter .2s,transform .2s,box-shadow .2s;box-shadow:0 5px 14px rgba(214,91,11,.2)}
button:hover{filter:brightness(1.12);transform:translateY(-2px);box-shadow:0 8px 20px rgba(214,91,11,.28)}
button.alt{background:linear-gradient(135deg,#183b63,#102844);border:1px solid #46698e;color:#fff;box-shadow:none}
button.alt:hover{background:#234b75}
input,select{padding:12px 14px;border:1px solid #49698d;border-radius:11px;font:inherit;width:100%;background:#eaf1f8;color:#14263d;outline:none}
input:focus,select:focus{border-color:var(--orange2);box-shadow:0 0 0 3px rgba(255,121,13,.2)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:13px}.field{display:grid;gap:7px;margin:10px 0;font-weight:600;color:#eaf1f8}
.muted{color:var(--muted);font-size:13px}
.session{border:1px solid #345678;border-right:4px solid var(--orange2);border-radius:15px;padding:17px;margin:13px 0;background:linear-gradient(115deg,#12345a,#0b203b);box-shadow:0 7px 18px rgba(0,0,0,.16)}
.session b{color:#fff}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.hidden{display:none}.notice{background:#3b2518;color:#ffd2ad;padding:13px 15px;border-radius:11px;margin:12px 0;border:1px solid #9b531f}.error{background:#421e26;color:#ffd4d4;border-color:#9b3b48}
table{width:100%;border-collapse:collapse;margin-top:12px;min-width:620px}td,th{text-align:right;padding:11px;border-bottom:1px solid #294563;font-size:13px}th{color:#fff;background:#173657}td{color:#e7eef7}.tablewrap{overflow:auto;border-radius:12px}
.pill{color:#ff9a43;font-weight:700}.red{color:#ff8989}
#notice:not(.hidden){display:block}
@media(max-width:600px){header{height:260px;min-height:260px;background-position:center 25%}main{padding:15px 11px 40px}.card{padding:16px;border-radius:16px}button{padding:10px 13px}h2{font-size:18px}}
</style></head>
<body>
<header role="img" aria-label="سالن فوتسال؛ مشاهده سانس‌ها و ثبت‌نام آنلاین بازیکنان"><h1 class="sr-only">سالن فوتسال</h1></header>
<main>
<div class="tabs"><button id="player-tab">سانس‌ها و ثبت‌نام</button><button class="alt" id="admin-tab">ورود مدیر</button></div>
<div id="notice" class="hidden"></div>
<section id="player">
<div class="card"><h2>سانس‌های فعال</h2><div id="sessions">در حال دریافت…</div><button class="alt" id="refresh">به‌روزرسانی</button></div>
<div class="card"><h2>ثبت‌نام بازیکن</h2><form id="reg"><div class="grid">
<div class="field">نام و نام خانوادگی<input name="player_name" required maxlength="100"></div>
<div class="field">شماره تماس<input name="phone" required maxlength="30"></div>
<div class="field">انتخاب سانس<select id="session-select" name="session_id" required><option value="">انتخاب سانس</option></select></div>
</div><button>ثبت‌نام</button><p class="muted">ثبت‌نام فوری است؛ تأیید پرداخت توسط مدیر انجام می‌شود.</p></form></div>
</section>
<section id="admin" class="hidden">
<div class="card" id="login"><h2>ورود مدیر</h2><form id="login-form"><div class="grid">
<div class="field">ایمیل<input name="email" type="email" required></div>
<div class="field">رمز عبور<input name="password" type="password" required></div>
</div><button>ورود</button></form></div>
<div id="panel" class="hidden">
<div class="card"><button id="logout">خروج مدیر</button><h2>ایجاد سانس</h2><form id="new-session"><div class="grid">
<div class="field">عنوان<input name="title" required></div><div class="field">تاریخ سانس (شمسی)<input id="session-date-jalali" type="text" placeholder="مثلاً ۱۴۰۵/۰۸/۱۶" autocomplete="off" required><input id="session-date-gregorian" name="session_date" type="hidden" required></div>
<div class="field">ساعت<input name="start_time" type="time" required></div><div class="field">مدت<input name="duration" value="۹۰ دقیقه" required></div>
<div class="field">هزینه (تومان)<input name="fee" type="number" min="0" value="0" required></div>
</div><button>ثبت سانس</button></form></div>
<div class="card"><h2>مدیریت ثبت‌نام‌ها و پرداخت</h2><div id="admin-sessions"></div></div>
</div></section>
</main>
<script>
const SUPABASE_URL="https://exruesqxsnrrjssrzqin.supabase.co";
const SUPABASE_KEY="sb_publishable_pMEubiQyZ9lLH8FWvT-U4A_QrG4pA0m";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const el=id=>document.getElementById(id);
let rows=[];
function msg(t,bad=false){el("notice").textContent=t;el("notice").className=bad?"notice error":"notice"}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function dateFa(d){return new Date(d+"T12:00:00").toLocaleDateString("fa-IR")}
function toman(n){return Number(n||0).toLocaleString("fa-IR")+" تومان"}
async function loadSessions(){
const {data,error}=await sb.from("sessions").select("id,title,session_date,start_time,duration,fee").eq("is_open",true).order("session_date").order("start_time");
if(error){el("sessions").textContent="خطا در دریافت سانس‌ها: "+error.message;return}
rows=data||[];
el("sessions").innerHTML=rows.length?rows.map(s=>'<div class="session"><b>'+esc(s.title)+'</b><p class="muted">'+dateFa(s.session_date)+"، "+esc(String(s.start_time).slice(0,5))+"، "+esc(s.duration||"")+'</p>'+toman(s.fee)+'</div>').join(""):"هنوز سانس فعالی وجود ندارد.";
el("session-select").innerHTML='<option value="">انتخاب سانس</option>'+rows.map(s=>'<option value="'+s.id+'">'+esc(s.title)+" - "+dateFa(s.session_date)+" "+esc(String(s.start_time).slice(0,5))+'</option>').join("");
}
el("refresh").onclick=loadSessions;
el("reg").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const {error}=await sb.from("registrations").insert({session_id:f.get("session_id"),player_name:f.get("player_name").trim(),phone:f.get("phone").trim()});if(error){msg("ثبت‌نام ناموفق: "+error.message,true);return}msg("ثبت‌نام با موفقیت انجام شد. پرداخت پس از بررسی مدیر تأیید می‌شود.");e.target.reset();loadSessions()};
function tab(a){el("player").classList.toggle("hidden",a);el("admin").classList.toggle("hidden",!a);if(a)checkAdmin()}
el("player-tab").onclick=()=>tab(false);el("admin-tab").onclick=()=>tab(true);
async function checkAdmin(){
const {data:{session}}=await sb.auth.getSession();
if(!session){el("login").classList.remove("hidden");el("panel").classList.add("hidden");return}
const {data}=await sb.from("admin_users").select("user_id").eq("user_id",session.user.id).maybeSingle();
if(!data){await sb.auth.signOut();msg("این حساب دسترسی مدیر ندارد.",true);return}
el("login").classList.add("hidden");el("panel").classList.remove("hidden");loadAdmin()
}
el("login-form").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const {error}=await sb.auth.signInWithPassword({email:f.get("email"),password:f.get("password")});if(error){msg("ورود ناموفق بود؛ ایمیل یا رمز عبور را بررسی کنید.",true);return}checkAdmin()};
el("logout").onclick=async()=>{await sb.auth.signOut();checkAdmin()};
$("#session-date-jalali").pDatepicker({
  format:"YYYY/MM/DD",
  autoClose:true,
  initialValue:false,
  observer:true,
  onSelect:function(unixDate){
    const gregorian = new persianDate(unixDate).toCalendar("gregorian").format("YYYY-MM-DD");
    el("session-date-gregorian").value = gregorian;
  }
});
el("session-date-jalali").addEventListener("input",()=>{
  el("session-date-gregorian").value="";
});
el("new-session").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);if(!f.get("session_date")){msg("لطفاً تاریخ شمسی را از تقویم انتخاب کنید.",true);return;}const {error}=await sb.from("sessions").insert({title:f.get("title"),session_date:f.get("session_date"),start_time:f.get("start_time"),duration:f.get("duration"),fee:Number(f.get("fee")),is_open:true});if(error){msg("خطا: "+error.message,true);return}msg("سانس ایجاد شد.");e.target.reset();loadAdmin();loadSessions()};
async function loadAdmin(){
const {data:sessions,error}=await sb.from("sessions").select("*").order("session_date",{ascending:false});
if(error){el("admin-sessions").textContent=error.message;return}
let out="";
for(const s of sessions||[]){
const {data:r,error:re}=await sb.from("registrations").select("*").eq("session_id",s.id).order("created_at");
out+='<div class="session"><div class="row"><b>'+esc(s.title)+'</b><span class="pill">'+((r||[]).length).toLocaleString("fa-IR")+' بازیکن ثبت‌نام‌شده</span></div><div class="muted">'+dateFa(s.session_date)+' — '+esc(String(s.start_time).slice(0,5))+' — '+toman(s.fee)+'</div><div class="actions"><button class="alt" data-open="'+s.id+'" data-val="'+s.is_open+'">'+(s.is_open?"بستن ثبت‌نام":"بازکردن ثبت‌نام")+'</button></div>';
if(re)out+='<p class="red">'+esc(re.message)+'</p>';
else if(r?.length)out+='<p class="muted">فهرست بازیکنان ('+r.length.toLocaleString("fa-IR")+' نفر)</p><div class="tablewrap"><table><tr><th>نام</th><th>تماس</th><th>مبلغ</th><th>پرداخت</th><th>عملیات</th></tr>'+r.map(x=>'<tr><td>'+esc(x.player_name)+'</td><td>'+esc(x.phone)+'</td><td>'+toman(x.amount)+'</td><td class="'+(x.paid?"pill":"red")+'">'+(x.paid?"پرداخت‌شده":"پرداخت‌نشده")+'</td><td><button data-paid="'+x.id+'" data-val="'+x.paid+'">'+(x.paid?"لغو تأیید":"تأیید پرداخت")+'</button></td></tr>').join("")+'</table></div>';
else out+="<p class=muted>ثبت‌نامی وجود ندارد.</p>";
out+="</div>";
}
el("admin-sessions").innerHTML=out||"سانسی وجود ندارد.";
el("admin-sessions").querySelectorAll("[data-paid]").forEach(b=>b.onclick=async()=>{const {error}=await sb.from("registrations").update({paid:b.dataset.val!=="true"}).eq("id",b.dataset.paid);if(error)msg(error.message,true);loadAdmin()});
el("admin-sessions").querySelectorAll("[data-open]").forEach(b=>b.onclick=async()=>{const {error}=await sb.from("sessions").update({is_open:b.dataset.val!=="true"}).eq("id",b.dataset.open);if(error)msg(error.message,true);loadAdmin();loadSessions()});
}
sb.auth.onAuthStateChange(()=>{if(!el("admin").classList.contains("hidden"))setTimeout(checkAdmin,0)});
loadSessions();
</script></body></html>
